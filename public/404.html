<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const repo = "/auto-upholstery-hub";
      const path = window.location.pathname.replace(repo, "");
      sessionStorage.setItem("redirect", path);
      window.location.replace(repo + "/");
    </script>
  </head>
</html>
